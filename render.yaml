services:
  - type: web
    name: pixelcraft-ai-studio
    env: python
    buildCommand: "npm install && npm run build && pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
